---
- name: Configure Local VM and Terminal Environment
  hosts: localhost
  connection: local
  become: yes

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install essential terminal and system utilities
      apt:
        name:
          - curl
          - git
          - bash-completion
          - htop
        state: present
      when: ansible_os_family == "Debian"

    - name: Ensure target working directories exist
      file:
        path: /opt/relfast/workspace
        state: directory
        mode: '0755'
