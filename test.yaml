---
- name: Infrastructure Deployment Configuration
  hosts: localhost
  connection: local
  # Remove become: yes so it runs directly with container permissions

  vars:
    deployment_type: "{{ deployment_type | default('Serverless') }}"
    configuration_runtime: "{{ configuration | default('Python 3.11') }}"
    memory_selection: "{{ memory_selection | default('1 vCPU / 2 GB') }}"
    network_type: "{{ network_type | default('Public') }}"
    vpc_id: "{{ vpc_id | default('') }}"
    security_group_name: "{{ security_group_name | default('') }}"
    allowed_port: "{{ allowed_port | default('80,443') }}"
    environment_vars: "{{ environment_variables | default('Prod') }}"

  tasks:
    - name: Print deployment parameters for verification
      debug:
        msg: >
          Deploying {{ deployment_type }} with runtime {{ configuration_runtime }},
          Network: {{ network_type }}, VPC: {{ vpc_id | default('None') }},
          Security Group: {{ security_group_name | default('None') }}
